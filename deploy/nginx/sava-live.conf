# ============================================================================
# SAVA Live — Nginx Reverse Proxy Configuration (sava-app.cloud)
# Lokasi di VPS Ubuntu: /etc/nginx/sites-available/sava-live.conf
# Aktifkan dengan: sudo ln -s /etc/nginx/sites-available/sava-live.conf /etc/nginx/sites-enabled/
# ============================================================================

# Map untuk menangani koneksi WebSocket (Socket.io) secara otomatis
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Upstream Backend NestJS (REST API + Socket.io WebSocket)
upstream sava_backend {
    server 127.0.0.1:3001;
    keepalive 64;
}

# Upstream Frontend Next.js
upstream sava_frontend {
    server 127.0.0.1:3000;
    keepalive 64;
}

# ----------------------------------------------------------------------------
# 1. API & WebSocket Server (api.sava-app.cloud)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.sava-app.cloud;

    # Ukuran maksimal payload (untuk upload frame PNG / header)
    client_max_body_size 25M;

    # Log khusus API
    access_log /var/log/nginx/sava-api.access.log;
    error_log  /var/log/nginx/sava-api.error.log;

    # Endpoint Socket.io (Real-time Live Wall & Galeri Tamu)
    location /socket.io/ {
        proxy_pass http://sava_backend/socket.io/;
        proxy_http_version 1.1;

        # Header wajib untuk WebSocket Upgrade
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Jaga koneksi WebSocket proyektor tetap hidup hingga 24 jam tanpa putus
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    # Endpoint REST API (/v1/...)
    location / {
        proxy_pass http://sava_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}

# ----------------------------------------------------------------------------
# 2. Frontend Next.js Server (sava-app.cloud & www.sava-app.cloud)
# ----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name sava-app.cloud www.sava-app.cloud;

    client_max_body_size 25M;

    access_log /var/log/nginx/sava-frontend.access.log;
    error_log  /var/log/nginx/sava-frontend.error.log;

    # Cache agresif untuk static assets Next.js
    location /_next/static/ {
        proxy_pass http://sava_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://sava_frontend;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
